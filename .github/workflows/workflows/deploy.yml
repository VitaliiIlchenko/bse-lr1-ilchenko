name: CI/CD Pipeline for SmartDoc API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Код із репозиторію
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Налаштовуємо Python 
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    # Залежності з requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    # Тести 
    - name: Run Tests
      run: |
        python -m unittest test_smartdoc.py